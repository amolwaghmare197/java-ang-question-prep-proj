plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.5'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Crucial Fix: Changed 'spring-boot-starter-webmvc' to 'spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-web:3.3.5'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa:3.3.5'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis:3.3.5'
	implementation 'org.springframework.boot:spring-boot-starter-cache:3.3.5'

	// MySQL Database Connector
	runtimeOnly 'com.mysql:mysql-connector-j:8.0.33'

	// Swagger UI / OpenAPI Docs
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

	// Flyway Migration Engines
	/*implementation 'org.flywaydb:flyway-core:10.15.0'
	implementation 'org.flywaydb:flyway-database-mysql:10.15.0'*/

	// Testing tools
	testImplementation 'org.springframework.boot:spring-boot-starter-test:3.3.5'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Lombok
	compileOnly 'org.projectlombok:lombok:1.18.36'
	annotationProcessor 'org.projectlombok:lombok:1.18.36'

	// For test compilation and testing
	testCompileOnly 'org.projectlombok:lombok:1.18.36'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'

	implementation 'org.apache.poi:poi-ooxml:5.2.5'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'
}



tasks.named('test') {
	useJUnitPlatform()
}
