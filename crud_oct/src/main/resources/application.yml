server:
  port: 8081

spring:
  application:
    name: xgsi-customer-portal-stage

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update # Changed from 'update' to ensure Flyway controls the schema

  flyway:
    baseline-on-migrate: true

  data:
    redis:
      repositories:
        enabled: false

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://localhost:3306/world?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&useLegacyDatetimeCode=false&serverTimezone=UTC"
    username: root
    password: root
    hikari:
      max-lifetime: 90000
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      keepalive-time: 3600000
      pool-name: HikariPool-Mysql
